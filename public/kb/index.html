<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IK Knowledge Base</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='%234f46e5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/kb/kb.css">
</head>
<body>
<div id="app" class="app" data-testid="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Knowledge Base</span></div>
    <button class="search-trigger" id="open-palette" data-testid="open-palette" type="button">
      <span>Search or create…</span><kbd id="palette-kbd">Ctrl K</kbd>
    </button>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="dashboard">Dashboard</a>
      <a href="#/records" data-nav="records">All records</a>
      <a href="#/programs" data-nav="programs">Programs</a>
      <a href="#/courses" data-nav="courses">Courses</a>
      <a href="#/resources" data-nav="resources">Resources</a>
      <a href="#/graph" data-nav="graph">Graph</a>
      <a href="#/quality" data-nav="quality">Data quality</a>
      <a href="#/proposals" data-nav="proposals">Approvals <span class="badge" id="pending-badge" hidden></span></a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="sidebar-foot">
      <div class="whoami" id="whoami" data-testid="whoami"></div>
      <a class="muted small" href="/">Corpus explorer ↗</a>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1">
    <div class="live-banner" id="live-banner" role="status" hidden></div>
    <div id="view" class="view"></div>
  </main>
  <aside class="panel" id="panel" aria-label="Record details" hidden></aside>
</div>

<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <h1>Knowledge Base</h1>
    <p id="gate-msg">Sign in with your Interview Kickstart Google account to continue.</p>
    <a class="btn primary" href="/">Sign in</a>
  </div>
</div>

<div class="overlay" id="palette" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <input id="palette-input" data-testid="palette-input" placeholder="Search records, or type to create…" autocomplete="off" aria-label="Search">
    <ul id="palette-results" class="palette-results" role="listbox"></ul>
    <div class="palette-foot muted small">↑↓ to move · Enter to open · Esc to close</div>
  </div>
</div>

<div class="overlay" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" id="modal-box"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/vendor/cytoscape.min.js"></script>
<script src="/kb/kb.js"></script>
</body>
</html>
