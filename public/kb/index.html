<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IK Knowledge Base</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='3' fill='%23324158'/%3E%3C/svg%3E">
<link rel="preload" href="/vendor/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/kb/kb.css">
<link rel="stylesheet" href="/kb/entity.css">
<!-- 2026-11-07: the startup modules in parallel, not discovered import by import (each level a round trip) -->
<link rel="modulepreload" href="/kb/js/app.js">
<link rel="modulepreload" href="/kb/js/core.js">
<link rel="modulepreload" href="/kb/js/live.js">
<link rel="modulepreload" href="/kb/js/realtime.js">
<link rel="modulepreload" href="/kb/js/detail.js">
<link rel="modulepreload" href="/kb/js/form.js">
<link rel="modulepreload" href="/kb/js/relpicker.js">
<link rel="modulepreload" href="/kb/js/aliases.js">
<link rel="modulepreload" href="/kb/js/page.js">
<link rel="modulepreload" href="/kb/js/views/dashboard.js">
<link rel="modulepreload" href="/kb/js/views/activity.js">
<link rel="modulepreload" href="/kb/js/views/search.js">
<!-- run 6 B2: graph styles; the lead keeps this one line when merging (B3 owns this file) -->
<link rel="stylesheet" href="/kb/graph.css">
</head>
<body>
<div id="app" class="app" data-testid="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <main class="main" id="main" tabindex="-1">
    <div class="live-banner" id="live-banner" role="status" hidden></div>
    <div id="view" class="page"></div>
  </main>
  <aside class="panel" id="panel" aria-label="Record details" hidden></aside>
</div>

<div class="gate" id="gate" hidden>
  <div class="gate-card" role="region" aria-labelledby="gate-title">
    <img class="gate-logo" src="/kb/brand/ik-logo.svg" alt="Interview Kickstart" width="150" height="32">
    <h1 class="brand" id="gate-title"><span>Knowledge Base</span></h1>
    <p id="gate-msg" class="muted">Sign in with your Interview Kickstart Google account to continue.</p>
    <div><a class="btn primary" href="/">Sign in</a></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/kb/js/app.js"></script>
</body>
</html>
