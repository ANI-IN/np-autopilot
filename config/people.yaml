# people.yaml — canonical person identities.
#
# PROVENANCE. Two source shapes, per config/taxonomy.yaml -> common_properties.
#   origin: corpus  names a corpus file and emits a sourced_from edge.
#   origin: hand    names out-of-corpus evidence and emits NO edge. It satisfies
#                   sources min_length: 1 but must never be presented as though a
#                   scan produced it. `evidence` is required and non-empty.
#
# The NP roster below comes from a screenshot of the HR system, hand-entered
# 2026-09-09. It is authoritative and CLOSED at 15 people. It is not a corpus
# file, has no file node, and every entry carries origin: hand.
#
# EMAILS. Directory emails are recorded under `work_email`, NOT under `aliases`.
# The excluded-fields rule drops any property whose normalised header matches
# Email / Work email / Personal email; putting an address in `aliases` would
# smuggle it past that rule under a different key. `work_email` is declared
# here as hand-entered identity evidence, is excluded from graph.json, and
# exists so a future roster join has something to match on. See the check at
# the end of this file.
#
# Local parts only — the domain is @interviewkickstart.com throughout.

