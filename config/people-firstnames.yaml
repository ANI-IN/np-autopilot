# `surname_candidates` are strings found elsewhere in the corpus that start with
# the same first name. Almost all are INSTRUCTORS or learners, not your team —
# they are listed so you can rule them out, not so you can pick from them. Only
# entries marked `evidence:` are backed by an internal @interviewkickstart.com
# address or the Delivery POC sheet.

