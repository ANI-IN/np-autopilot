# module-merges.yaml — the answers to REVIEW-QUEUE MOD-01..16.
#
# origin: hand. Animesh Kumar, 2026-09-29. These emit no `sourced_from` edge
# and must never be presented as though a scan produced them.
#
# WHAT A MERGE DOES, AND WHAT IT MUST NOT DO
#
#   keeps  every label_raw, every provenance record, every edge. The legacy
#          node is absorbed, not deleted: its label_raw moves to
#          `merged_label_raw`, its sources are unioned, its edges are
#          retargeted and each one records the id it came from.
#   never  merges EVIDENCE TIERS. A legacy `teaches` edge and a mastersheet
#          `taught_by` edge are two different claims about staffing and are
#          kept apart, tagged `tier`. Collapsing them would invent agreement
#          between two sources that have not been reconciled — and staffing
#          is the question CLAUDE.md §4 records a filter already hiding once.
#   always records its MOD id on every node and edge it touches, so any single
#          merge can be reversed without unpicking the others.
#
# NO SOURCE FILE IS EDITED. The corpus is read-only (§1) and the two graph
# JSONs are build outputs; this file is the only place the decision lives.

