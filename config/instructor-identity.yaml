    aliases: [Balaram Velega]
    status: confirmed
    origin: hand
    evidence: >-
      Owner decision 2026-09-29 (Animesh Kumar), answering REVIEW-QUEUE
      INS-05/INS-06. The mastersheet spells it `Balaram Velaga`, and that is
      the canonical form. `Balaram Velega` is the same person. Both spellings
      stay in label_raw and in provenance; neither source is edited.
    resolves: [INS-05, INS-06]

  # ---- INS-08 / INS-30 -------------------------------------------------
  # `Bill` is a conventional short form of `William`, so these MAY be one
  # person. Exact matching never pairs them; a nickname table pairs them along
