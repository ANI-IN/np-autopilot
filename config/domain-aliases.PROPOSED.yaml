# domain-aliases.yaml — PROPOSAL, 2026-09-10. NOTHING HERE IS APPLIED.
#
# Same discipline as people.yaml: the pipeline NEVER infers an alias. Each entry
# below is a proposal you confirm by setting `confirmed: true`. Anything left
# false is ignored by the build, exactly like workflow-owners.yaml.
#
# Direction: `alias` is the string as written in a source sheet;
#            `domain` is the label in Domains_Courses Owners!Sheet1.
#
# TWO CORRECTIONS to the list you sent:
#   - You wrote "DABA -> Data Analyst & Business Analyst" and
#     "DSA -> Data Structures & Algorithms". That is backwards: DABA and
#     Coding Masterclass (DSA) are the DOMAIN labels; the long forms are the
#     alias strings that need mapping onto them. Written the right way round below.
#   - "Agentic AI" (64 claims) is AMBIGUOUS and is NOT proposed. Three domains
#     exist — Agentic AI - EM, Agentic AI - SWE, Agentic AI - TPM/Pm — and a
#     bare "Agentic AI" does not say which. Guessing would put 64 instructors on
#     the wrong domain. See `ambiguous:` at the bottom.

version: 1

aliases:

  # ---- unambiguous abbreviation or long-form of exactly one domain ----
  - {alias: "ML",                              domain: "Machine Learning (IP course)", claims: 153, confirmed: false}
  - {alias: "Data Analyst & Business Analyst", domain: "DABA",                         claims: 57,  confirmed: false}
  - {alias: "Data & Business Analyst",         domain: "DABA",                         claims: 1,   confirmed: false}
