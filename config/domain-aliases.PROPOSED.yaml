    claims: 64
    candidates: ["Agentic AI - EM", "Agentic AI - SWE", "Agentic AI - TPM/Pm",
                 "India Agentic AI Bootcamp"]
    why: >
      Four domains carry the name. A bare "Agentic AI" does not say which, and
      64 instructors would land on the wrong one. Options: map to all four
      (over-connects), leave unjoined (current), or add a rule using the
      instructor's other columns.
  - alias: "Applied Gen AI"
    claims: 42
    candidates: []
    why: "No domain in the 42 is named Gen AI. May be a product that predates or postdates the owner sheet."
  - alias: "Advanced Gen AI"
    claims: 16
    candidates: []
    why: "Same as above."
  - alias: "Career"
    claims: 13
    candidates: ["Career Classes", "Career Coaching"]
    why: "Two domains, and the claim string is a bare prefix of both."

