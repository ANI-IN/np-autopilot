     note: "Same call as above."}
  - {alias: "AWS Cloud Solutions Architect",   domain: "Cloud",                        claims: 18,  confirmed: false,
     note: "A vendor certification, not a domain name. Mapping it to Cloud is a judgement, not a synonym."}
  - {alias: "AWS Cloud Solution Architect",    domain: "Cloud",                        claims: 4,   confirmed: false}

  # ---- TYPO. This one is spell-correction, which R12 forbids the pipeline from
  # doing on its own. It is legitimate ONLY as a human-confirmed alias. ----
  - {alias: "Andriod Engineering",             domain: "Android",                      claims: 4,   confirmed: false,
     note: "Source misspelling. Confirming this is you asserting the correction, not the pipeline inferring it."}

# ---------------------------------------------------------------------------
# AMBIGUOUS — deliberately not proposed. Resolving these needs a rule you supply,
# not a mapping I choose.
# ---------------------------------------------------------------------------
ambiguous:
